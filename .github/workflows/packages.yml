name: packages
on:
  push:
    branches: [main]
    paths: ['packages/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/packages.yml']
  pull_request:
    paths: ['packages/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/packages.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
