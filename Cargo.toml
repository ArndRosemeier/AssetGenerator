[workspace]
resolver = "2"
members = ["viewer/monster_pack"]
default-members = ["viewer/monster_pack"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
engine = { path = "../Engine/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
